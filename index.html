<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120c08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M♡T Console">
<title>M♡T Console</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c08;--card:linear-gradient(180deg,rgba(46,31,18,.86),rgba(16,10,7,.9));--solid:#1c130c;--ink:#fbf3e4;--mute:#cdbfa8;--faint:#9a8b74;
--line:rgba(242,184,75,.22);--soft:rgba(255,226,170,.08);--gold:#f2b84b;--gold-hi:#ffd98a;--gold-deep:#b97a1f;--gold-d:#b97a1f;
--trial:#f2b84b;--trial-bg:rgba(242,184,75,.14);--paid:#3fcf8e;--paid-bg:rgba(63,207,142,.14);--exp:#b3a690;--exp-bg:rgba(255,236,200,.08);--blk:#ff6b52;--blk-bg:rgba(255,107,82,.14);
--goldbtn:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-deep));--sh:0 0 0 1px rgba(242,184,75,.18),0 10px 30px rgba(0,0,0,.35)}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,13,10,.12) 0%,rgba(18,13,10,.05) 30%,rgba(18,13,10,.62) 62%,rgba(12,8,6,.93) 100%),url(bg-sunset.webp) center 35%/cover no-repeat,#120c08}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:#120c08}html,body{margin:0;height:100%;color:var(--ink);font:15px/1.5 "Noto Kufi Arabic",system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
.lat{font-family:Montserrat,system-ui,sans-serif}
.mono{font-family:Montserrat,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.num{font-family:Montserrat,system-ui,sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;max-width:820px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px}
.mk{display:flex;direction:ltr;align-items:center;gap:1px;font:700 20px/1 Montserrat,sans-serif;letter-spacing:.02em}
.mk svg{width:20px;height:20px;color:var(--gold);margin:0 1px}
.mk{color:var(--ink);text-shadow:0 2px 12px rgba(0,0,0,.5)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:3px;flex:1}
.brand small{font:500 9px/1 Montserrat,sans-serif;letter-spacing:.38em;color:var(--mute)}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid rgba(242,184,75,.3);background:rgba(12,8,6,.45);color:var(--gold-hi);display:grid;place-items:center;cursor:pointer}
.ib svg{width:19px;height:19px}
.sw{position:relative}
.sw svg{position:absolute;right:13px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search{width:100%;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(12,8,6,.55);padding:0 40px 0 12px;font-size:15px;outline:none}
.search::placeholder{color:var(--faint);font-family:"Noto Kufi Arabic",sans-serif;font-size:13px}
.search:focus{border-color:var(--gold)}
.list{background:linear-gradient(180deg,rgba(26,17,10,.8),rgba(14,9,6,.88));border:1px solid rgba(242,184,75,.16);border-radius:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;padding:2px 2px calc(env(safe-area-inset-bottom,0px) + 40px);overscroll-behavior:contain}
.grp{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.it{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;position:relative}
.it+.it{border-top:1px solid rgba(242,184,75,.12)}
.it:active{background:rgba(255,226,170,.08)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font:700 15px/1 "Noto Kufi Arabic",sans-serif}
.av svg{width:19px;height:19px}
.g-paid .av{background:var(--paid-bg);color:var(--paid)}.g-trial .av{background:var(--trial-bg);color:var(--trial)}
.g-expired .av{background:var(--exp-bg);color:var(--exp)}.g-blocked .av{background:var(--blk-bg);color:var(--blk)}
.tx{flex:1;display:grid;gap:2px}
.t1{font:600 16px/1.3 Montserrat,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.02em;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1.ar{font:700 15px/1.4 "Noto Kufi Arabic",sans-serif;direction:rtl;letter-spacing:0}
.t1.none{color:var(--mute);font:500 14px/1.4 "Noto Kufi Arabic",sans-serif;direction:rtl;letter-spacing:0}
.t2{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex:none;font-size:12px;font-weight:700;text-align:left}
.g-trial .st{color:var(--trial)}.g-expired .st{color:var(--exp)}.g-blocked .st{color:var(--blk)}
.vip{display:inline-flex;align-items:center;gap:4px;font:700 11px/1 Montserrat,sans-serif;letter-spacing:.1em;color:#2a1704;background:var(--goldbtn);padding:6px 9px;border-radius:8px}
.vip svg{width:12px;height:12px}
.empty{text-align:center;color:var(--mute);padding:56px 0;font-size:13px}
.sk{height:72px;border-radius:18px;background:linear-gradient(90deg,rgba(255,226,170,.05),rgba(255,226,170,.12),rgba(255,226,170,.05));background-size:200% 100%;animation:sk 1.2s infinite linear;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
.code-st{font-size:12px;font-weight:700}
.st-UNUSED{color:var(--trial)}.st-REDEEMED{color:var(--paid)}.st-REVOKED{color:var(--exp)}
.btn{height:48px;border-radius:14px;border:0;background:var(--goldbtn);color:#2a1704;box-shadow:0 6px 18px rgba(242,160,40,.3),inset 0 1px 0 rgba(255,255,255,.55);font-weight:700;padding:0 18px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:rgba(255,226,170,.08);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.red{background:none;color:var(--blk);box-shadow:inset 0 0 0 1px var(--blk)}
.btn:disabled{opacity:.5}
.in{height:48px;border-radius:14px;border:1px solid var(--line);background:rgba(12,8,6,.55);padding:0 12px;font-size:16px;outline:none;width:100%;text-align:center}
.in:focus{border-color:var(--gold)}
.sheet{position:fixed;inset:0;max-width:820px;margin:0 auto;overflow-y:auto;background:linear-gradient(180deg,rgba(14,9,6,.55),rgba(12,8,6,.92) 55%),url(bg-sunset.webp) center 35%/cover no-repeat,#120c08;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:20}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph .nm{font-weight:700;font-size:15px;flex:1}
.sheet.on{transform:none}
.hero{display:grid;justify-items:center;gap:6px;padding:18px 0 22px;text-align:center}
.hero .av{width:64px;height:64px;border-radius:20px}.hero .av svg{width:28px;height:28px}
.hero .t1{font-size:24px;text-align:center}.hero .t1.ar,.hero .t1.none{font-size:18px}
.hero .t2{font-size:13px}
.hero .bdg{margin-top:4px;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px}
.g-paid .bdg{background:var(--goldbtn);color:#2a1704}.g-trial .bdg{background:var(--trial-bg);color:var(--trial)}
.g-expired .bdg{background:var(--exp-bg);color:var(--exp)}.g-blocked .bdg{background:var(--blk-bg);color:var(--blk)}
.kv{background:var(--card);box-shadow:var(--sh);border-radius:18px;overflow:hidden;margin-bottom:14px}
.kv>div{display:flex;align-items:center;gap:12px;padding:13px 14px;font-size:13px}
.kv>div+div{border-top:1px solid rgba(242,184,75,.12)}
.kv span{color:var(--mute);flex:none}
.kv b{flex:1;text-align:left;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv [data-c]{cursor:copy}
.kv .cp{flex:none;width:16px;height:16px;color:var(--faint)}
.sec{display:grid;gap:10px;margin-bottom:12px}
.sec h4{margin:0;font-size:13px;color:var(--mute);font-weight:500}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.out{border:1px solid var(--gold);background:var(--trial-bg);border-radius:14px;padding:14px;text-align:center;direction:ltr;cursor:copy}
.out b{display:block;font-size:20px;letter-spacing:.06em}
.out small{font-size:11px;color:var(--mute)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translate(-50%,-140%);background:var(--goldbtn);color:#2a1704;font-weight:700;padding:10px 18px;border-radius:999px;font-size:13px;transition:transform .2s;z-index:30;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.login{position:fixed;inset:0;background:rgba(14,9,6,.55);display:grid;place-items:center;padding:24px;z-index:5}
.login .box{width:100%;max-width:340px;display:grid;gap:14px;text-align:center}
.login .mk{justify-content:center;font-size:44px}
.login .mk svg{width:44px;height:44px}
.login small{font:300 11px/1 Montserrat,sans-serif;letter-spacing:.5em;color:var(--mute);margin-bottom:22px}
.hide{display:none!important}
.done{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;background:var(--paid-bg);color:var(--paid);font-weight:700;font-size:15px}
.rq{padding:0;overflow:hidden}
.rq .rh{display:flex;align-items:center;gap:12px;padding:14px}
.rq .rh .t1{font-size:19px}
.rq .lbl{flex:none;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--trial-bg);color:var(--trial);display:inline-flex;align-items:center;gap:6px}
.rq .lbl i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
.rq .ph2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.rq .ph2 a{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600}
.rq .ph2 a+a{border-inline-start:1px solid var(--line)}
.rq .ph2 svg{width:16px;height:16px;color:var(--mute)}
.rq .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 6px;border-top:1px solid var(--line)}
.rq .acts .btn{height:46px;font-size:14px}

.rq .acts .rej{grid-column:1/-1;height:38px;background:none;color:var(--blk);font-weight:600}
.rq .acts .btn.sure{background:var(--blk);color:#fff}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--blk);color:#fff;font:700 11px/1 Montserrat,sans-serif}
.t3{font-size:13px;font-weight:700}
.body{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;padding:0 10px 0 12px;min-height:0}
.nav{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.nv{position:relative;border:1px solid transparent;background:none;border-radius:14px;padding:10px 2px 8px;display:grid;justify-items:center;gap:5px;cursor:pointer;color:var(--mute);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.nv .ni{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(12,8,6,.5);border:1px solid var(--line)}
.nv .ni svg{width:19px;height:19px}
.nv .ni .badge{position:absolute;top:-6px;left:-7px;border:2px solid var(--bg);height:22px;min-width:22px;border-radius:11px}
.nv .nl{font-size:10.5px;font-weight:700;line-height:1.35;text-align:center}
.nv small{font:600 11px/1 Montserrat,sans-serif;color:var(--faint)}
.nv.on{background:var(--card);border-color:rgba(242,184,75,.45);color:var(--ink);box-shadow:0 0 14px rgba(255,180,60,.18)}
.nv.on::after{content:"";position:absolute;right:-1px;top:14px;bottom:14px;width:3px;border-radius:3px 0 0 3px;background:var(--ink)}
.nv.n-req .ni{color:var(--blk)}.nv.n-trial .ni{color:var(--trial)}.nv.n-vip .ni{color:var(--paid)}.nv.n-blk .ni{color:var(--exp)}
.nv.on.n-req .ni{background:var(--blk-bg)}.nv.on.n-trial .ni{background:var(--trial-bg)}.nv.on.n-vip .ni{background:var(--paid-bg)}.nv.on.n-blk .ni{background:var(--exp-bg)}
.nv.on.n-req::after{background:var(--blk)}.nv.on.n-trial::after{background:var(--trial)}.nv.on.n-vip::after{background:var(--paid)}.nv.on.n-blk::after{background:var(--exp)}
.main{display:grid;grid-template-rows:auto auto 1fr;gap:10px;min-height:0}
.ttl{margin:4px 2px 0;font-size:17px;font-weight:800;color:var(--gold-hi);text-shadow:0 2px 10px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px}
.ttl b{font:600 13px/1 Montserrat,sans-serif;color:var(--faint)}
.it{padding:12px 12px 12px 10px;gap:10px;align-items:flex-start}
.it .av{width:34px;height:34px;border-radius:10px}.it .av svg{width:17px;height:17px}
.it .t1{font-size:16px;text-align:right}
.it .st{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;font-weight:700;text-align:right}
.it .st .ok{color:var(--paid)}.it .st .red{color:var(--blk)}
.t2.red{color:var(--blk);font-weight:600}
.rq .rh{padding:14px 14px 12px}
.rq .sd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.rq .sd small{font-size:11px;color:var(--faint)}
.rq .rh .t1{font-size:20px;text-align:right}
.rq .acts{grid-template-columns:1fr}
.btn.life{background:var(--goldbtn);color:#2a1704}
.btn.sure{background:var(--blk)!important;color:#fff!important;border-color:var(--blk)!important}
.sh{margin:18px 4px 8px;font-size:12px;color:var(--mute);font-weight:700}
.kv .go{cursor:pointer}.kv .go span{color:var(--ink);font-weight:600;flex:1}.kv .go b{display:none}
.kv .go .cp{width:18px;height:18px}
.tg{flex:none;width:44px;height:26px;border-radius:13px;background:var(--soft);border:1px solid var(--line);position:relative;transition:.2s}
.tg::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fbf3e4;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.2s}
.tg.on{background:var(--gold);border-color:var(--gold)}.tg.on::after{right:20px}
.cc{cursor:default}.ccr{display:flex;align-items:center;justify-content:space-between;gap:8px}.ccr.t2{margin-top:6px}
.sheet .empty{padding:30px 0}
.it .st .soft{color:var(--mute);font-weight:600}
.it.end .av,.hero.g-expired .av{background:var(--exp-bg);color:var(--exp)}
.nv.n-end .ni{color:var(--exp)}.nv.on.n-end .ni{background:var(--exp-bg)}.nv.on.n-end::after{background:var(--exp)}
.home{position:fixed;inset:0;z-index:4;overflow-y:auto;max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.home .hb{display:flex;justify-content:flex-end;gap:10px}
.home .brand2{display:grid;justify-items:center;gap:8px;margin:26px 0 26px;text-align:center}
.home .brand2 .mk{font-size:40px}.home .brand2 .mk svg{width:40px;height:40px}
.home .brand2 small{font:500 11px/1 Montserrat,sans-serif;letter-spacing:.5em;color:var(--mute);padding-left:.5em}
.home .brand2 b{font:600 15px/1 Montserrat,sans-serif;color:var(--gold-hi);letter-spacing:.04em;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border:0;border-radius:24px;padding:18px 14px 16px;display:grid;justify-items:center;gap:10px;cursor:pointer;color:var(--ink);text-align:center;
  background:linear-gradient(180deg,rgba(46,31,18,.82),rgba(14,9,6,.9));
  box-shadow:0 0 0 1.5px rgba(255,201,105,.7),0 0 18px rgba(255,180,60,.35),inset 0 1px 0 rgba(255,236,200,.3),inset 0 0 30px rgba(255,180,70,.06)}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.12),transparent 32%);pointer-events:none}
.tile:active{transform:scale(.98)}
.tile .ti{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(12,8,6,.55);border:1px solid var(--line)}
.tile .ti svg{width:24px;height:24px}
.tile .tn{font-size:14px;font-weight:700}
.tile .tc{font:700 30px/1 Montserrat,sans-serif;color:var(--gold-hi)}
.tile.wide{grid-column:1/-1;grid-template-columns:auto 1fr auto;justify-items:start;align-items:center;padding:18px}
.tile.wide .tn{font-size:17px}.tile.wide .tc{font-size:34px}
.tile.hot .tc{color:#fff;background:var(--blk);border-radius:14px;padding:8px 12px;font-size:26px;box-shadow:0 0 18px rgba(255,107,82,.55)}
.t-req .ti{color:var(--blk)}.t-trial .ti{color:var(--trial)}.t-end .ti{color:var(--exp)}.t-vip .ti{color:var(--paid)}.t-blk .ti{color:var(--blk)}
.foot{text-align:center;font:500 11px Montserrat,sans-serif;color:var(--faint);margin-top:26px;letter-spacing:.08em}
.nv.n-home .ni{color:var(--gold-hi)}
.dlg{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(8,5,3,.72)}
.dlg .box{width:100%;max-width:320px;border-radius:24px;padding:22px 18px 18px;text-align:center;background:linear-gradient(180deg,rgba(46,31,18,.96),rgba(14,9,6,.98));box-shadow:0 0 0 1.5px rgba(255,201,105,.7),0 0 26px rgba(255,180,60,.3)}
.dlg h3{margin:0 0 18px;font-size:17px}
.dlg .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.lab{font:600 11px/1 Montserrat,sans-serif;letter-spacing:.16em;color:var(--mute);text-align:left;direction:ltr;margin:4px 2px -8px}
.pay{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;padding:7px 10px;border-radius:12px;background:rgba(242,184,75,.1);border:1px solid rgba(242,184,75,.28)}.pay b{color:var(--gold-hi)}.pay span{color:var(--ink);font-weight:600;direction:auto}.pay.cash{background:rgba(120,200,150,.1);border-color:rgba(120,200,150,.3)}.pay.none{color:var(--mute);background:transparent;border-style:dashed}
</style>
</head>

<div class="login" id="login">
  <div class="box">
    <div class="mk">M<svg><use href="#h"/></svg>T</div>

// Back button: page → sections → home → "exit?" (yes / no).
let view = "home", leaving = false;
function showView(v) { view = v; $("#home").classList.toggle("hide", v !== "home"); $("#app").classList.toggle("hide", v !== "sec"); }
function openSec(t) { tab = t; $("#list").scrollTop = 0; if (view !== "sec") { showView("sec"); try { history.pushState({ v: "sec" }, ""); } catch(e) {} } render(); }
function goHome() { if (view === "sec" && history.state && history.state.v === "sec") history.back(); else showView("home"); }
function armBack() { try { history.replaceState({ v: "root" }, ""); history.pushState({ v: "home" }, ""); } catch(e) {} }
window.addEventListener("popstate", () => {
  if (leaving) return;
  if (sheetOpen) return hideSheet();
  if (!$("#dlg").classList.contains("hide")) { $("#dlg").classList.add("hide"); return history.pushState({ v: "home" }, ""); }
  if (view === "sec") return showView("home");
  if (!key) return;
  $("#dlg").classList.remove("hide");
});
$("#exitN").onclick = () => { $("#dlg").classList.add("hide"); try { history.pushState({ v: "home" }, ""); } catch(e) {} };
$("#exitY").onclick = () => { leaving = true; $("#dlg").classList.add("hide"); history.back(); setTimeout(() => { try { window.close(); } catch(e) {} }, 300); };

const lastApproved = id => ((data && data.requests) || []).filter(r => r.deviceId === id && r.status === "APPROVED").sort((a, b) => b.at - a.at)[0];
function deviceSheet(d) {
  sel = d.id;
  const w = who(d.id), s = sect(d);
  const act = s === "vip" ? '<div class="done">✓ مفعّل VIP</div><button class="btn ghost" data-a="deact">إلغاء التفعيل</button>'
    : s === "trial" || s === "end" ? '<button class="btn life" data-a="life">تفعيل VIP</button>' + (d.group === "paid" ? '<button class="btn ghost" data-a="deact">إلغاء التفعيل</button>' : "") : "";
  openSheet(w && w.name ? esc(w.name) : "تفاصيل الجهاز", `
    <div class="hero g-${d.group}"><div class="av">${AV[d.group]}</div>${t1(w)}<div class="t2">${esc(sub(d, w))}</div>
      <div class="bdg">${esc(bdg(d))}</div></div>
    <div class="kv">
      ${w ? kv("رقم التلفون", esc(localPhone(w.phone)), w.phone) : ""}
      ${w && w.name ? kv("الاسم", esc(w.name), "", true) : ""}
      ${kv("نوع الجهاز", esc(d.model || "جهاز أندرويد"))}
      ${d.app ? kv("نسخة التطبيق", "v" + esc(d.app)) : ""}
      ${kv("رقم الجهاز", fmtId(d.id), d.id)}
      ${d.activation ? kv("رقم التفعيل", shortAct(d.activation.activationId), d.activation.activationId) : ""}
    </div>
    ${act ? `<div class="sec">${act}</div>` : ""}
    ${s === "trial" || s === "end" ? `<h4 class="sh">زيادة أيام التجربة</h4><div class="sec"><div class="addd"><input class="in lat" id="d1" inputmode="numeric" value="3"><button class="btn ghost" data-a="dadd">زيادة الأيام</button></div></div>` : ""}
    <div class="sec">${d.group === "blocked" ? '<button class="btn ghost" data-a="unblock">فك الحظر</button>' : '<button class="btn red" data-a="block">حظر</button>'}</div>
    <div class="sec"><button class="btn ghost" data-a="hide">إزالة من القائمة</button></div>`);
}
function codesSheet() {
  sel = null;
  openSheet("الأكواد", `<div class="sec"><button class="btn" data-a="code">إصدار كود لأي جهاز</button><div id="res"></div></div>
    ${(data.codes || []).length ? data.codes.map(codeCard).join("") : '<div class="empty">لا توجد أكواد</div>'}`);
}
function settingsSheet() {
  const snd = store.get("mts") !== "off";
  openSheet("الإعدادات", `
    <div class="kv${data && !data.legacy ? "" : " hide"}">${data && !data.legacy ? `<div data-a="codes" class="go"><span>الأكواد</span><b></b><i class="cp">${CHEV}</i></div>` : ""}</div>
    <h4 class="sh">الإشعارات والأصوات</h4>
    <div class="kv"><div data-a="snd" class="go"><span>صوت وإشعار لما يوصل طلب أو كابتن جديد</span><b></b><i class="tg${snd ? " on" : ""}"></i></div></div>
    <h4 class="sh">مدة التجربة للأجهزة الجديدة</h4>
    <div class="sec"><div class="pair"><input class="in lat" id="dt" inputmode="numeric" value="${data ? data.defaultTrialDays : 3}"><button class="btn ghost" data-a="deftrial">حفظ</button></div></div>
    <div class="sec" style="margin-top:22px"><button class="btn ghost" data-a="logout">تسجيل الخروج</button></div>`);
}
function busy(btn, on) { if (btn) btn.disabled = on; }
function num(id) { const n = parseInt(($("#" + id) || {}).value, 10); return isNaN(n) ? -1 : n; }
// Lifetime, cancel and block ask for a second tap (no change by mistake).
const sure = x => { if (x.dataset.ok) return true; if (!x.dataset.t) x.dataset.t = x.textContent; x.dataset.ok = "1"; x.classList.add("sure"); x.textContent = "متأكد؟ اكبس كمان مرة";
  setTimeout(() => { if (x.isConnected && x.dataset.ok) { delete x.dataset.ok; x.classList.remove("sure"); x.textContent = x.dataset.t; } }, 5000); return false; };

function onAct(e) {
  if (e.target.closest("[data-back]")) return closeSheet();
  const cp = e.target.closest("[data-c]"); if (cp) { if (cp.dataset.c) copy(cp.dataset.c); return; }
  const rv = e.target.closest("[data-rv]");
  if (rv) { rv.disabled = true; api("revoke_code", { codeId: rv.dataset.rv }).then(() => { toast("تم الإلغاء"); return load(); }, fail).then(() => { if (data) codesSheet(); }); return; }
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a;
  if (a === "codes") { history.replaceState({ sheet: 1 }, ""); return codesSheet(); }
  if (a === "dadd") {
    const n = num("d1"); if (n < 1 || n > 365) return toast("مدة غير صالحة");
    const d = data && data.devices.find(x => x.id === sel); if (!d || !d.created) return toast("الجهاز غير موجود");
    const now = Date.now(), D = 86400000, base = d.group === "trial" && d.end ? d.end : now;
    busy(b, true);
    return api("update_device", { deviceId: d.id, trialDays: Math.min(365, Math.ceil((base - d.created) / D) + n) })
      .then(() => { toast("تمت زيادة " + n + " أيام"); closeSheet(); load(); }, fail).then(() => busy(b, false));
  }
  if (a === "snd") {
    const on = store.get("mts") === "off"; store.set("mts", on ? "on" : "off"); b.querySelector(".tg").classList.toggle("on", on);
    if (on) { chime(); try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch(e) {} }
    return;
  }
  if (a === "logout") { store.set("mtk", null); store.set("mtk2", null); store.set("mtm", null); key = null; mode = "console"; tok = null; seen = null; $("#tok").value = ""; $("#tok").classList.add("hide"); $("#tokl").classList.add("hide"); closeSheet(); showView("none"); $("#login").classList.remove("hide"); return; }
  let p;
  if (a === "code") {
    // Every code is lifetime (days 0 = permanent on the server).
    busy(b, true);
    return api("create_code", { deviceId: sel || "", days: 0, count: 1 }).then(r => {
      const c = r.codes[0];
      $("#res").innerHTML = `<div class="out" data-c="${esc(c.code)}"><b class="mono">${esc(c.code)}</b><small>مؤبد · انسخ</small></div>`;
      copy(c.code); load();
    }, fail).then(() => busy(b, false));
  }
  if (a === "life") {
    if (!sure(b)) return;
    // A pending request for this device is approved (so the captain sees it); otherwise the device is set lifetime directly.
    const pr = ((data && data.requests) || []).find(r => r.deviceId === sel && r.status === "PENDING");
    busy(b, true);
    return (pr ? api("approve_request", { requestId: pr.id, plan: "life" }) : api("update_device", { deviceId: sel, permanent: true }))
      .then(() => { toast("تم تفعيل VIP"); closeSheet(); load(); }, fail).then(() => busy(b, false));
  }
  if (a === "deact") {
    if (!sure(b)) return;
    // Activated from a request: cancel that request (the app shows it); otherwise remove lifetime.
    const ar = lastApproved(sel);
    busy(b, true);
    return (ar ? api("revoke_request", { requestId: ar.id }) : api("update_device", { deviceId: sel, permanent: false }))
      .then(() => { toast("تم إلغاء التفعيل"); closeSheet(); load(); }, fail).then(() => busy(b, false));
  }
  if (a === "block") { if (!sure(b)) return; p = { deviceId: sel, blocked: true }; }
  if (a === "unblock") p = { deviceId: sel, blocked: false };
  if (a === "hide") {
    // Local only: removes the device from this phone's list; nothing changes on the server.
    if (!b.dataset.ok) { b.dataset.ok = "1"; b.textContent = "تأكيد الإزالة"; return; }
    const h = hidden(); h.push(sel); store.set("mth", JSON.stringify(h)); toast("تمت الإزالة"); closeSheet(); render(); return;
  }
  const DONE = { block: "تم الحظر", unblock: "تم فك الحظر" };
  if (a === "deftrial") {
    const n = num("dt"); if (n < 0 || n > 365) return toast("مدة غير صالحة");
    busy(b, true);
    return api("set_default_trial", { days: n }).then(() => { toast("تم الحفظ"); closeSheet(); load(); }, fail).then(() => busy(b, false));
  }
  if (p) { busy(b, true); api("update_device", p).then(() => { toast(DONE[a] || "تم"); closeSheet(); load(); }, fail).then(() => busy(b, false)); }
}
$("#sheet").addEventListener("click", onAct);

$("#list").addEventListener("click", e => {
  if (e.target.closest("[data-a]")) return onAct(e);
  const ap = e.target.closest("[data-ap]"), rj = e.target.closest("[data-rj]");
  if (ap && ap.dataset.ap === "life" && !sure(ap)) return;
  if (ap || rj) {
    const b = ap || rj;
    b.closest(".acts").querySelectorAll("button").forEach(x => x.disabled = true);
    const op = ap ? api("approve_request", { requestId: ap.dataset.rq, plan: ap.dataset.ap }) : api("reject_request", { requestId: rj.dataset.rj });
    op.then(() => { toast(ap ? "تم تفعيل VIP" : "تم الرفض"); load(); },
      e => { b.closest(".acts").querySelectorAll("button").forEach(x => x.disabled = false); fail(e); });
    return;
  }
  const c = e.target.closest("[data-id]");
  if (c && data && !c.dataset.a) { const d = data.devices.find(x => x.id === c.dataset.id); if (d) deviceSheet(d); }
});
function setTab(t) { if (t === "home") return goHome(); tab = t; $("#list").scrollTop = 0; render(); }
$("#nav").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (b) setTab(b.dataset.t); });
$("#tiles").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (b) openSec(b.dataset.t); });
$("#q").addEventListener("input", render);
$("#gear").onclick = settingsSheet;
$("#gear2").onclick = settingsSheet;

function enter() {
  const v = $("#key").value.trim(); if (!v) return;
  const t = $("#tok").value.trim();
  key = v;
  if (t) { mode = "legacy"; tok = t; }
  api("overview").then(r => {
    store.set("mtk", v); store.set("mtm", mode); if (mode === "legacy") store.set("mtk2", tok);
    $("#login").classList.add("hide"); data = r; notifyNew(r);
    showView("home"); armBack(); render();
  }, e => {
    const m = String(e && e.message);
    // Current server checks the API token before anything else, so the console route answers UNAUTHORIZED.
    if ((m === "UNKNOWN_ACTION" || m === "UNAUTHORIZED") && mode === "console") { $("#tok").classList.remove("hide"); $("#tokl").classList.remove("hide"); $("#tok").focus(); toast("أدخل API_TOKEN"); return; }
    key = null; fail(e);
  });
}
$("#enter").onclick = enter;
$("#key").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
$("#tok").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
let deferred = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("#install").classList.remove("hide"); });
window.addEventListener("appinstalled", () => $("#install").classList.add("hide"));
$("#install").onclick = () => { if (!deferred) return; deferred.prompt(); deferred.userChoice.finally(() => { deferred = null; $("#install").classList.add("hide"); }); };
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (key) { $("#login").classList.add("hide"); showView("home"); armBack(); load(); }
setInterval(() => { if (key && !$("#sheet").classList.contains("on") && document.visibilityState === "visible") load(); }, 60000);
}
</script>
</body>
</html>
